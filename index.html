<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060b10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Heliograph" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Heliograph — a world map of sunlight</title>
    <meta
      name="description"
      content="See where the sun falls on Earth at any date and time. Real satellite terrain, true twilight colour, the Moon and its light, eclipses for the next century, and every time zone on one local clock."
    />
    <link rel="canonical" href="https://chraltro.github.io/heliograph/" />

    <!--
      The preview card. Nearly every share of a link like this happens somewhere
      that unfurls it, so the card is the first thing most people will see of
      the map: it is a render of the real thing, no chrome, chosen so the
      terminator and the city lights both read at thumbnail size.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heliograph" />
    <meta property="og:title" content="Heliograph — a world map of sunlight" />
    <meta
      property="og:description"
      content="Where the sun falls on Earth, at any date and time. Real satellite terrain, true twilight colour, the Moon and its light, and eclipses for the next century."
    />
    <meta property="og:url" content="https://chraltro.github.io/heliograph/" />
    <meta property="og:image" content="https://chraltro.github.io/heliograph/social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A world map shaded by sunlight, with the terminator sweeping across Asia and the city lights lit on the night side." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heliograph — a world map of sunlight" />
    <meta
      name="twitter:description"
      content="Where the sun falls on Earth, at any date and time. Satellite terrain, true twilight colour, the Moon, and eclipses for the next century."
    />
    <meta name="twitter:image" content="https://chraltro.github.io/heliograph/social.jpg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23060b10'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23f7ad30'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Heliograph needs JavaScript and WebGL2 to draw the map.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
